<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Toppers | Vishnu PCM Classes</title>

    <meta
        name="description"
        content="View the academic achievements and toppers of Vishnu PCM Classes in Rajajipuram, Lucknow."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="canonical"
        href="https://vishnupcmwebsite.vercel.app/toppers.html"
    >

    <link rel="stylesheet" href="pages.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 6%;
        }

        .logo a {
            text-decoration: none;
            color: inherit;
            font-size: 24px;
            font-weight: 700;
        }

        #mainNav {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        #mainNav a {
            text-decoration: none;
            color: inherit;
            font-weight: 600;
        }

        #mainNav a.active {
            color: #d4af37;
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            font-size: 28px;
            padding: 5px 10px;
            cursor: pointer;
            color: inherit;
        }

        .page-section {
            max-width: 1250px;
            margin: auto;
            padding: 80px 6%;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-heading h1 {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .page-heading p {
            font-size: 18px;
            opacity: 0.8;
        }

        .toppers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .topper-card {
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            transition: 0.3s ease;
        }

        .topper-card:hover {
            transform: translateY(-7px);
        }

        .topper-card img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 18px;
        }

        .topper-card h2 {
            font-size: 22px;
            margin: 10px 0;
        }

        .topper-details {
            color: #d4af37;
            font-weight: 700;
            line-height: 1.6;
        }

        .topper-review {
            margin-top: 15px;
            line-height: 1.6;
            opacity: 0.85;
        }

        .no-data {
            text-align: center;
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 1000px) {

            .toppers-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            header {
                position: relative;
            }

            .menu-toggle {
                display: block;
            }

            #mainNav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 8px 5%;
                background: #651515;
                z-index: 10000;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            }

            #mainNav.open,
            #mainNav.active {
                display: flex;
            }

            #mainNav a {
                width: 100%;
                padding: 13px 5px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            }

            .page-section {
                padding: 50px 5%;
            }

            .page-heading h1 {
                font-size: 34px;
            }

            .toppers-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>


<header class="site-header">

    <div class="logo">

        <a href="index.html">
            VISHNU PCM CLASSES
        </a>

    </div>


    <button
        class="menu-btn menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >
        ☰
    </button>


    <nav id="mainNav">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="courses.html">Courses</a>

        <a href="faculty.html">Faculty</a>

        <a href="results.html">Results</a>

        <a href="admissions.html">Admissions</a>

        <a href="gallery.html">Gallery</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<main>

    <section class="page-section">

        <div class="page-heading">

            <h1>Our Toppers</h1>

            <p>
                Celebrating the academic achievements of our students.
            </p>

        </div>


        <div
            id="toppersGrid"
            class="toppers-grid"
        ></div>

    </section>

</main>


<footer>

    <p>
        © 2026 Vishnu PCM Classes. All Rights Reserved.
    </p>

</footer>


<script>

const API_URL =
    "https://vishnu-pcm-admin.onrender.com";


function getImageUrl(photo) {

    if (!photo) {
        return "";
    }

    if (
        photo.startsWith("http://") ||
        photo.startsWith("https://")
    ) {
        return photo;
    }

    return API_URL + photo;
}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;
}


async function loadToppers() {

    const grid =
        document.getElementById("toppersGrid");

    try {

        const response =
            await fetch(`${API_URL}/api/public`);

        if (!response.ok) {
            throw new Error("Unable to load toppers");
        }

        const data =
            await response.json();

        const toppers =
            data.toppers || [];

        grid.innerHTML = "";


        if (toppers.length === 0) {

            grid.innerHTML = `
                <div class="no-data">
                    <h2>No topper information available.</h2>
                </div>
            `;

            return;
        }


        toppers.forEach(topper => {

            const card =
                document.createElement("div");

            card.className =
                "topper-card";


            const imageHTML =
                topper.photo
                ? `
                    <img
                        src="${getImageUrl(topper.photo)}"
                        alt="${escapeHTML(topper.name)}"
                    >
                `
                : `
                    <div style="
                        width:180px;
                        height:180px;
                        margin:0 auto 18px;
                        border-radius:15px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#333;
                        font-size:50px;
                    ">
                        🏆
                    </div>
                `;


            card.innerHTML = `

                ${imageHTML}

                <h2>
                    ${escapeHTML(topper.name)}
                </h2>

                <div class="topper-details">
                    ${escapeHTML(
                        topper.details || ""
                    )}
                </div>

                ${
                    topper.review
                    ? `
                        <p class="topper-review">
                            "${escapeHTML(
                                topper.review
                            )}"
                        </p>
                    `
                    : ""
                }

            `;


            grid.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        grid.innerHTML = `
            <div class="no-data">
                <h2>Unable to load toppers.</h2>
                <p>Please try again later.</p>
            </div>
        `;

    }

}


loadToppers();

</script>

<script src="pages.js"></script>

</body>
</html>
