<script>

const API_URL =
    "https://vishnu-pcm-admin.onrender.com";


/* ================= IMAGE URL ================= */

function getImageUrl(photo) {

    if (!photo) {
        return "";
    }

    if (
        photo.startsWith("http://") ||
        photo.startsWith("https://")
    ) {
        return photo;
    }

    return API_URL + photo;
}


/* ================= ESCAPE HTML ================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;
}


/* ================= LOAD FACULTY ================= */

async function loadFaculty() {

    const grid =
        document.getElementById("facultyGrid");

    try {

        const response =
            await fetch(
                `${API_URL}/api/public`
            );

        if (!response.ok) {

            throw new Error(
                "Unable to load faculty"
            );

        }

        const data =
            await response.json();

        const faculty =
            data.faculty || [];

        grid.innerHTML = "";


        if (faculty.length === 0) {

            grid.innerHTML = `
                <div class="info-card">

                    <h3>
                        No faculty information available.
                    </h3>

                </div>
            `;

            return;
        }


        faculty.forEach(teacher => {

            const card =
                document.createElement("div");

            card.className =
                "faculty-page-card";


            /* IMAGE */

            let imageHTML = "";

            if (teacher.photo) {

                imageHTML = `
                    <img
                        src="${getImageUrl(teacher.photo)}"
                        alt="${escapeHTML(teacher.name)}"
                        loading="lazy"
                    >
                `;

            } else {

                imageHTML = `
                    <div class="faculty-placeholder">
                        👨‍🏫
                    </div>
                `;

            }


            /* CARD */

            card.innerHTML = `

                ${imageHTML}

                <div>

                    <h3>
                        ${escapeHTML(
                            teacher.name
                        )}
                    </h3>

                    <span>
                        ${escapeHTML(
                            teacher.subject
                        )}
                    </span>

                    <p>
                        ${escapeHTML(
                            teacher.description || ""
                        )}
                    </p>

                </div>

            `;


            grid.appendChild(card);

        });

    }

    catch (error) {

        console.error(error);

        grid.innerHTML = `

            <div class="info-card">

                <h3>
                    Unable to load faculty.
                </h3>

                <p>
                    Please try again later.
                </p>

            </div>

        `;

    }

}


/* ================= MOBILE MENU ================= */

const menuToggle =
    document.getElementById("menuToggle");

const mainNav =
    document.getElementById("mainNav");

const setMenuState = function (isOpen) {
    mainNav.classList.toggle("open", isOpen);
    mainNav.classList.toggle("active", isOpen);
    menuToggle.setAttribute("aria-expanded", String(isOpen));
    menuToggle.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
};

menuToggle.onclick = (event) => {
    event.preventDefault();
    event.stopPropagation();
    setMenuState(!mainNav.classList.contains("open"));
};

document.addEventListener("click", function (event) {
    if (event.target && !event.target.closest("#mainNav") && !event.target.closest("#menuToggle")) {
        setMenuState(false);
    }
});

mainNav
    .querySelectorAll("a")
    .forEach(link => {

        link.onclick = () => {
            setMenuState(false);
        };

    });


/* ================= START ================= */

loadFaculty();

</script>

<script src="pages.js"></script>

</body>
